services:
  - type: web
    name: gaja-server
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # fill this in with gaja-client's onrender.com URL after the first deploy
      # (both services get created together, but each needs the other's
      # already-assigned URL, so this one blank can't be known up front)
      - key: CLIENT_ORIGIN
        sync: false
      - key: NODE_ENV
        value: production

  - type: web
    name: gaja-client
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: ./client/dist
    envVars:
      # fill this in with gaja-server's onrender.com URL after the first deploy,
      # then trigger a manual redeploy of gaja-client — VITE_API_URL is baked in
      # at build time, so just changing the env var alone doesn't take effect
      - key: VITE_API_URL
        sync: false
