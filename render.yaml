services:
  - type: web
    name: gaja
    runtime: node
    plan: free
    # operates from the repo root (no rootDir) — the build needs to reach both
    # client/ and server/, and the server serves the client's build output at
    # runtime (server/src/index.js), so they have to ship as one service.
    #
    # --include=dev: NODE_ENV=production (set below, needed at *runtime* for
    # the secure-cookie flag in server/src/auth.js) also affects this build
    # step, and `npm install` skips devDependencies whenever NODE_ENV is
    # "production" — vite is a client devDependency, so without this flag the
    # install silently omits it and `vite build` fails with "command not
    # found" (exit 127). Reproduced and confirmed locally before fixing.
    buildCommand: npm install --include=dev && npm run build -w client
    # the migration is idempotent (server/src/schema.sql uses "if not exists"),
    # safe to run on every deploy rather than as a manual one-off step
    startCommand: npm run migrate -w server && npm start -w server
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      # baked into the client bundle at build time (Vite) — this is what turns
      # on the sign-in gate and the backend-backed store instead of the local
      # in-memory one; see client/src/api/{auth,store}.js
      - key: VITE_USE_API
        value: 'true'
